<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/style.css">
    <title>SeeMD</title>
</head>
<body>
    <div class="main">
        <div class="header">
            <div class="title">
                <h1 class="title-test">SeeMD</h1>
            </div>
        </div>
        <div class="content">
            <div class="output-container" id="output-container">
                <div class="all-output"></div>
            </div>
            <div class="input-container">
                <form action="#" id="inputEntered">
                    <input type="text" name="command" id="command" placeholder="Enter a command..." autocomplete="off" maxlength="30">
                    <input type="submit" id="submit" value="Send">
                </form>
            </div>
        </div>
        <div class="footer">
            <p class="">Made by arensagun2</p>
        </div>
    </div>
    <script src="./src/script.js"></script>
</body>
</html>
